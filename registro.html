<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario - Sangre Azúl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: url('loginnn.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: #f8f9fa; 
        }
        
        .navbar-custom {
            background-color: #961919; 
            border-bottom: 2px solid #1a252f;
        }
        .navbar-custom .text-dark,
        .navbar-custom a.text-dark {
            color: #31060a !important; 
        }
        
        .card-login {
            background-color: #212529 !important; 
            border: 1px solid #343a40;
            color: #161414; 
        }
        
        .form-control-custom {
            background-color: #330915; 
            color: #ffffff !important; 
        }
        .btn-outline-custom {
            color: #961919; 
            border-color: #1a252f;
        }
        .btn-outline-custom:hover {
            background-color: #000000;
            color: #961934;
        }
    </style>
</head>
<body>

    <header class="navbar-custom py-3 mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-heart" style="color: #c0392b; font-size: 1.2rem;"></i>
                <strong class="fs-5 text-dark text-capitalize">Sangre Azúl</strong>
            </div>
            <nav class="d-flex gap-3">
                <a href="#" class="text-decoration-none text-dark">Home</a> |
                <a href="#" class="text-decoration-none text-dark">Productos</a> |
                <a href="#" class="text-decoration-none text-dark">Nosotros</a> |
                <a href="#" class="text-decoration-none text-dark">Blogs</a> |
                <a href="#" class="text-decoration-none text-dark">Contacto</a>
            </nav>
            <div class="text-dark">
                🛒 Cart (0)
            </div>
        </div>
    </header>

    <main class="container d-flex flex-column align-items-center">
        
        <h2 class="mb-4 fw-bold text-white fs-1">Sangre Azúl</h2>

        <div class="card card-login p-4 border shadow-lg" style="width: 100%; max-width: 500px;">
            <div class="p-0 text-start mb-4 fw-bold fs-5" style="color: #961934;">
                Inicio de Sesión
            </div>

            <form>

                <div class="mb-3 text-start">
                    <label for="Nombre completo" class="form-label text-white small fw-bold">Nombre completo</label>
                    <input type="Nombre completo" class="form-control form-control-custom" id="correo">
                </div>


                <div class="mb-3 text-start">
                    <label for="correo" class="form-label text-white small fw-bold">Correo</label>
                    <input type="email" class="form-control form-control-custom" id="correo">
                </div>

                <div class="mb-4 text-start">
                    <label for="Contraseña" class="form-label text-white small fw-bold">Contraseña</label>
                    <input type="Contraseña" class="form-control form-control-custom" id="password">
                </div>

                <div class="mb-4 text-start">
                    <label for="Confirmar contraseña" class="form-label text-white small fw-bold">Confirmar contraseña</label>
                    <input type="Confirmar contraseña" class="form-control form-control-custom" id="password">
                </div>

                
                <div class="mb-4 text-start">
                    <label for="Telefono (opcional)" class="form-label text-white small fw-bold">Telefono (opcional)</label>
                    <input type="Telefono" class="form-control form-control-custom" id="password">
                </div>

                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-outline-custom px-5 py-2">Registrar</button>
                </div>
            </form>
        </div>

    </main>

</body>
</html>
