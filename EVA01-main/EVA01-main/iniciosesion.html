<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Veneno Dulce</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-image: url('img/miau.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #f8f9fa; 
        }
        
    </style>
</head>
<body>

    <header class="navbar-custom py-3 mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-heart" style="color: #ff3333; font-size: 1.2rem;"></i>
                <strong class="fs-5 text-white text-capitalize">Veneno Dulce</strong>
            </div>
                <nav class="d-flex gap-3">
                <a href="index.html" class="text-decoration-none text-white">Home</a> |
                <a href="productos.html" class="text-decoration-none text-white fw-bold">Productos</a> |
                <a href="nosotros.html" class="text-decoration-none text-white">Nosotros</a> |
                <a href="blogs.html" class="text-decoration-none text-white">Blogs</a> |
                <a href="contactos.html" class="text-decoration-none text-white">Contacto</a> |
                <a href="registro.html" class="text-decoration-none text-white">Registrarse</a> |
                <a href="iniciosesion.html" class="text-decoration-none text-white">Iniciar sesión</a> |
            </nav>
            <div class="text-white">
                🛒 Cart (0)
            </div>
        </div>
    </header>

    <!-- Contenedor alineado a la izquierda -->
    <main class="container d-flex flex-column align-items-start my-auto">

        <!-- ms-md-5 empuja la tarjeta hacia la izquierda alineándola con el inicio del texto superior -->
        <div class="card card-login p-4 border shadow-lg my-5 ms-md-5" style="width: 100%; max-width: 420px;">
            <div class="p-0 text-start mb-4 fw-bold fs-4" style="color: #e61c24;">
                Inicio de Sesión
            </div>

            <form>
                <div class="mb-3 text-start">
                    <label for="correo" class="form-label text-white small fw-bold">Correo</label>
                    <input type="email" class="form-control form-control-custom" id="correo">
                </div>

                <div class="mb-4 text-start">
                    <label for="password" class="form-label text-white small fw-bold">Contraseña</label>
                    <input type="password" class="form-control form-control-custom" id="password">
                </div>

                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-outline-custom px-5 py-2 fw-bold">Iniciar sesión</button>
                </div>
            </form>
        </div>

    </main>

</body>
</html>
