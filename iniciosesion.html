<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sangre Azúl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: url('miau.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #f8f9fa; 
        }
        
        /* Barra superior */
        .navbar-custom {
            background-color: #1f1c1d; 
            border-bottom: 2px solid #1f1c1d;
        }
        .navbar-custom .text-white,
        .navbar-custom a.text-white {
            color: #ffffff !important; 
        }
        
        /* Tarjeta principal */
        .card-login {
            background-color: #212529 !important; 
            border: 1px solid #343a40;
            color: #f8f9fa; 
        }
        
        /* Inputs del formulario */
        .form-control-custom {
            background-color: #330915; 
            border: 1px solid #5c060e;
            color: #ffffff !important; 
        }
        .form-control-custom:focus {
            background-color: #420b1c;
            border-color: #961919;
            box-shadow: 0 0 5px rgba(150, 25, 25, 0.5);
        }

        /* Botón rojo gótico */
        .btn-outline-custom {
            color: #ffffff; 
            border-color: #7d0a14;
            background-color: #7d0a14;
        }
        .btn-outline-custom:hover {
            background-color: #000000;
            color: #ff4d4d;
            border-color: #000000;
        }
    </style>
</head>
<body>

    <header class="navbar-custom py-3 mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-heart" style="color: #551818; font-size: 1.2rem;"></i>
                <strong class="fs-5 text-white text-capitalize">Sangre Azúl</strong>
            </div>
            <nav class="d-flex gap-3">
                <a href="index.html" class="text-decoration-none text-white">Home</a> |
                <a href="productos.html" class="text-decoration-none text-white">Productos</a> |
                <a href="nosotros.html" class="text-decoration-none text-white">Nosotros</a> |
                <a href="blogs.html" class="text-decoration-none text-white">Blogs</a> |
                <a href="contactos.html" class="text-decoration-none text-white">Contacto</a>
            </nav>
            <div class="text-white">
                🛒 Cart (0)
            </div>
        </div>
    </header>

    <!-- Contenedor alineado a la izquierda -->
    <main class="container d-flex flex-column align-items-start my-auto">

        <!-- ms-md-5 empuja la tarjeta hacia la izquierda alineándola con el inicio del texto superior -->
        <div class="card card-login p-4 border shadow-lg my-5 ms-md-5" style="width: 100%; max-width: 420px;">
            <div class="p-0 text-start mb-4 fw-bold fs-4" style="color: #e61c24;">
                Inicio de Sesión
            </div>

            <form>
                <div class="mb-3 text-start">
                    <label for="correo" class="form-label text-white small fw-bold">Correo</label>
                    <input type="email" class="form-control form-control-custom" id="correo">
                </div>

                <div class="mb-4 text-start">
                    <label for="password" class="form-label text-white small fw-bold">Contraseña</label>
                    <input type="password" class="form-control form-control-custom" id="password">
                </div>

                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-outline-custom px-5 py-2 fw-bold">Iniciar sesión</button>
                </div>
            </form>
        </div>

    </main>

</body>
</html>
